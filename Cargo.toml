[package]
name = "jev-rust"
version = "0.1.0"
edition = "2024"
description = "Typesafe AI API wrapper for Rust"
license = "MIT"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }
